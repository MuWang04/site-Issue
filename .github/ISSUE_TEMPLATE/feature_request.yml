name: 功能建议
description: 提出新功能、内容建议或改进想法
title: "[功能建议] "
body:
  - type: markdown
    attributes:
      value: |
        这里用于提出新功能或改进建议，不用于报告故障。

        请描述需求和使用场景。


  - type: checkboxes
    id: domain_scope
    attributes:
      label: 域名范围确认
      options:
        - label: "我确认提出的功能建议在 *.046699.xyz 域名下。"
          required: true
          
  - type: input
    id: area
    attributes:
      label: 需要功能建议网站
      description: 自动填充，可手动修改
      placeholder: 例如：www.046699.xyz
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: 希望新增或改进什么
      description: 用一两句话说明你想要的功能或改进
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 使用场景和原因
      description: 你在什么情况下需要它？能解决什么问题？
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望效果（可选）
      description: 如果你对展示方式或交互有想法，可以写在这里
